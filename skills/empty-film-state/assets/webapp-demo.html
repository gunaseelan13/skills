<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planboard · Projects</title>
  <style>
    :root {
      --page: #f4f5f7; --card: #ffffff; --ink: #1b1d21; --ink-soft: #5c6370; --ink-faint: #8a909b;
      --outline: #e2e4e8; --accent: #0a9b4b; --accent-soft: #e3f4ea; --on-accent: #ffffff;
      --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px;
      --radius-sm: 8px; --radius-md: 12px; --radius-button: 24px; --height-button: 44px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page: #121316; --card: #1b1d21; --ink: #eceef2; --ink-soft: #a2a8b3; --ink-faint: #737a86;
        --outline: #2c2f35; --accent: #21b866; --accent-soft: #163222; --on-accent: #06210f;
      }
    }
    :root[data-theme="dark"] {
      --page: #121316; --card: #1b1d21; --ink: #eceef2; --ink-soft: #a2a8b3; --ink-faint: #737a86;
      --outline: #2c2f35; --accent: #21b866; --accent-soft: #163222; --on-accent: #06210f;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--page); color: var(--ink);
      font: 14px/1.45 "Inter", system-ui, -apple-system, sans-serif;
      display: grid; grid-template-columns: 232px 1fr;
    }
    svg.icon { width: 20px; height: 20px; fill: currentColor; flex: none; }

    /* Sidebar */
    .side {
      background: var(--card); border-right: 1px solid var(--outline);
      display: flex; flex-direction: column; padding: var(--space-lg) var(--space-md);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; font-weight: 650; font-size: 15px; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent);
      display: grid; place-items: center;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav a {
      display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: var(--radius-sm);
      color: var(--ink-soft); text-decoration: none; font-weight: 500;
    }
    .nav a.on { background: var(--accent-soft); color: var(--ink); }
    .nav a.on svg { color: var(--accent); }
    .nav-label { margin: 20px 10px 6px; font-size: 12px; color: var(--ink-faint); font-weight: 500; }
    .nav-empty { margin: 0 10px; font-size: 13px; color: var(--ink-faint); }
    .side-foot { margin-top: auto; }
    .me { display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 6px; border-top: 1px solid var(--outline); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center; font-size: 12px; font-weight: 650;
    }
    .me-name { font-weight: 550; }
    .me-mail { font-size: 12px; color: var(--ink-faint); }

    /* Main */
    .main { display: flex; flex-direction: column; min-width: 0; }
    .top {
      height: 64px; display: flex; align-items: center; gap: var(--space-md); padding: 0 28px;
      border-bottom: 1px solid var(--outline); background: var(--card);
    }
    .top h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .crumb { color: var(--ink-faint); font-size: 13px; margin-left: 2px; }
    .search {
      margin-left: auto; width: 280px; height: 36px; display: flex; align-items: center; gap: 8px;
      padding: 0 12px; border-radius: 18px; background: var(--page); color: var(--ink-faint); font-size: 13px;
    }
    .search svg { width: 18px; height: 18px; }
    .kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--outline); border-radius: 5px; padding: 0 5px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-soft);
    }

    /* The empty state, built from the skill's structure */
    .content { flex: 1; display: grid; place-items: start center; padding-top: 8px; }
    .empty-film {
      --film-page: var(--page); --film-card: var(--card); --film-ink: var(--ink);
      --film-ink-soft: var(--ink-soft); --film-outline: var(--outline);
      --film-accent: var(--accent); --film-on-accent: var(--on-accent);
      width: 440px; display: flex; flex-direction: column; align-items: center; padding-top: var(--space-xl);
    }
    .empty-film-canvas { width: 100%; height: 380px; display: block; }
    .empty-film-title { margin: var(--space-md) 0 0; font-size: 20px; font-weight: 650; text-align: center; }
    .empty-film-desc { margin: var(--space-xs) 0 0; padding: 0 var(--space-lg); color: var(--ink-soft); text-align: center; font-size: 15px; }
    .empty-film-button {
      width: 100%; height: var(--height-button); border: 0; border-radius: var(--radius-button);
      font: 600 15px "Inter", system-ui, sans-serif; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .empty-film-primary { margin-top: var(--space-xl); background: var(--accent); color: var(--on-accent); }
    .empty-film-secondary { margin-top: var(--space-md); background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--outline); }
  </style>
</head>

  <script type="module">
    import { emptyFilmState } from './skeleton-film.js'
    import { webappFilm } from './webapp-film.js'

    const params = new URLSearchParams(location.search)
    if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme')
    const { root, film } = emptyFilmState(document.getElementById('app'), {
      script: webappFilm,
      title: 'Keep work in projects',
      description: 'Group related tasks so the whole team sees what is next.',
      primary: 'New project',
      secondary: 'Import from CSV',
    })

    if (params.has('t')) {

      film.draw()
    }

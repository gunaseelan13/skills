<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empty film state demo</title>
  <style>
    /* Map the film to your design system's tokens here; these stand-ins follow light and dark. */
    :root {
      --page: #eef0f3; --card: #ffffff; --ink: #1b1d21; --ink-soft: #5c6370;
      --outline: #d6d9de; --accent: #0a9b4b; --on-accent: #ffffff;
      --space-xs: 4px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px;
      --radius-button: 24px; --height-button: 48px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page: #121316; --card: #1e2024; --ink: #eceef2; --ink-soft: #a2a8b3;
        --outline: #33363c; --accent: #21b866; --on-accent: #06210f;
      }
    }
    :root[data-theme="dark"] {
      --page: #121316; --card: #1e2024; --ink: #eceef2; --ink-soft: #a2a8b3;
      --outline: #33363c; --accent: #21b866; --on-accent: #06210f;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 0 var(--space-lg); }

    .empty-film {
      --film-page: var(--page); --film-card: var(--card); --film-ink: var(--ink);
      --film-ink-soft: var(--ink-soft); --film-outline: var(--outline);
      --film-accent: var(--accent); --film-on-accent: var(--on-accent);
      display: flex; flex-direction: column; align-items: center; padding-top: var(--space-xl);
    }
    .empty-film-canvas { width: 100%; height: 380px; display: block; }
    .empty-film-title { margin: var(--space-md) 0 0; font-size: 20px; font-weight: 600; text-align: center; }
    .empty-film-desc {
      margin: var(--space-xs) 0 0; padding: 0 var(--space-lg);
      color: var(--ink-soft); text-align: center;
    }
    .empty-film-button {
      width: 100%; height: var(--height-button); border: 0; border-radius: var(--radius-button);
      font: 600 16px system-ui, sans-serif; cursor: pointer;
    }
    .empty-film-primary { margin-top: var(--space-xl); background: var(--accent); color: var(--on-accent); }
    .empty-film-secondary { margin-top: var(--space-md); background: var(--card); color: var(--ink); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import { emptyFilmState } from './skeleton-film.js'
    import { projectsFilm } from './example-film.js'

    const params = new URLSearchParams(location.search)
    if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme')
    const { film } = emptyFilmState(document.getElementById('app'), {
      script: projectsFilm,
      title: 'Keep work in projects',
      description: 'Group related tasks so the whole team sees what is next.',
      primary: 'New Project',
      onPrimary: () => alert('New Project'),
    })
    // ?t=6.4 draws that second of the script and holds it, for captures.
    if (params.has('t')) {
      Object.defineProperty(film, 't', { get: () => Number(params.get('t')) })
      film.draw()
    }
  </script>
</body>
</html>
